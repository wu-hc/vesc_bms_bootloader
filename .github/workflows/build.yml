name: Build VESC BMS Bootloader

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 拉取仓库代码
    - name: Checkout repository
      uses: actions/checkout@v3

    # 安装 ARM GCC 和 make
    - name: Install ARM GCC and Make
      run: |
        sudo apt update
        sudo apt install -y gcc-arm-none-eabi make

    # 编译 bootloader
    - name: Build Bootloader
      run: |
        cd vesc_bms_bootloader
        make clean
        make

    # 上传生成的 bin 文件，方便下载
    - name: Upload Bootloader bin
      uses: actions/upload-artifact@v4
      with:
        name: bootloader-bin
        path: vesc_bms_bootloader/build/*.bin
